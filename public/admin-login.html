<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acesso Administrativo | Programa Padrinho</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
</head>
<body>
<div id="tsparticles"></div>

<div class="page">
  <nav class="navbar">
    <a href="/" class="brand">
      <span class="flame">🔥</span>
      <span>PROGRAMA PADRINHO <small>AMBIPAR · BOMBEIROS</small></span>
    </a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>🔑 Área do Administrador</h2>
      <div class="sub">Acesso restrito. Informe a chave de administrador para visualizar todos os treinamentos.</div>

      <div class="alert alert-error" id="alertErro"></div>

      <form id="formAdmin">
        <div class="field">
          <label>Chave de acesso</label>
          <input type="password" id="chaveAdmin" placeholder="Digite a chave de administrador" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnAdmin">
          <span class="label">Acessar painel</span>
        </button>
      </form>

      <div class="admin-link-row">
        Não é administrador? <a href="/entrar.html">Voltar para o login de bombeiro</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
  const form = document.getElementById('formAdmin');
  const alertErro = document.getElementById('alertErro');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertErro.classList.remove('show');
    const btn = document.getElementById('btnAdmin');
    btn.disabled = true;
    try {
      await api('/api/admin/auth/login', { method: 'POST', body: { chave: document.getElementById('chaveAdmin').value } });
      window.location.href = '/admin.html';
    } catch (err) {
      alertErro.textContent = err.message;
      alertErro.classList.add('show');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
